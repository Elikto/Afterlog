name: Compiler NØCTARIA APK
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'web/**'
      - 'scripts/**'
      - 'shared/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
concurrency:
  group: noctaria-android-release
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
      - name: Vérifier les profils Spotify communs Android et iPhone
        run: |
          node scripts/sync-spotify-profiles.mjs --check
          node scripts/check-parity.mjs
      - name: Vérifier que les captures Shotgun sont autorisées
        run: |
          if grep -q 'LayoutParams.FLAG_SECURE' app/src/main/java/fr/afterlog/app/ShotgunBrowserActivity.java; then
            echo 'Erreur : les captures écran sont bloquées dans le navigateur Shotgun.' >&2
            exit 1
          fi
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Installer le SDK Android
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" || { echo "sdkmanager introuvable"; exit 1; }
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Identifier la version Android
        id: appversion
        shell: bash
        run: |
          VERSION="$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION" || { echo "Version Android introuvable"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Préparer la clé Android permanente
        id: signing
        env:
          AFTERLOG_SIGNING_BUNDLE: ${{ secrets.AFTERLOG_SIGNING_BUNDLE }}
          LEGACY_KEYSTORE: ${{ secrets.AFTERLOG_KEYSTORE_BASE64 }}
          LEGACY_PASSWORD: ${{ secrets.AFTERLOG_KEYSTORE_PASSWORD }}
          LEGACY_ALIAS: ${{ secrets.AFTERLOG_KEY_ALIAS }}
          LEGACY_KEY_PASSWORD: ${{ secrets.AFTERLOG_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$AFTERLOG_SIGNING_BUNDLE" ]]; then
            python3 - <<'PY'
          import base64, json, os, pathlib, re
          config=json.loads(base64.b64decode(os.environ["AFTERLOG_SIGNING_BUNDLE"],validate=True))
          payload=base64.b64decode(config["keystore_base64"],validate=True)
          if not 512<len(payload)<100000:
              raise ValueError("Clé Android non valide")
          name=config["alias"]; pw=config["store_password"]; keypw=config["key_password"]
          if not re.fullmatch(r"[a-zA-Z0-9_-]{6,128}",name):
              raise ValueError("Alias invalide")
          if any(not re.fullmatch(r"[a-zA-Z0-9_-]{20,128}",value) for value in (pw,keypw)):
              raise ValueError("Mot de passe invalide")
          path=pathlib.Path(os.environ["RUNNER_TEMP"])/"afterlog-release.p12"
          path.write_bytes(payload); path.chmod(0o600)
          for secret in (pw,keypw): print("::add-mask::"+secret)
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as output:
              output.write("AFTERLOG_KEYSTORE_FILE="+str(path)+"\n")
              output.write("AFTERLOG_KEYSTORE_PASSWORD="+pw+"\n")
              output.write("AFTERLOG_KEY_ALIAS="+name+"\n")
              output.write("AFTERLOG_KEY_PASSWORD="+keypw+"\n")
          PY
            echo "persistent=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "$LEGACY_KEYSTORE" && -n "$LEGACY_PASSWORD" && -n "$LEGACY_ALIAS" && -n "$LEGACY_KEY_PASSWORD" ]]; then
            printf '%s' "$LEGACY_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/afterlog-release.jks"
            chmod 600 "$RUNNER_TEMP/afterlog-release.jks"
            echo "AFTERLOG_KEYSTORE_FILE=$RUNNER_TEMP/afterlog-release.jks" >> "$GITHUB_ENV"
            echo "AFTERLOG_KEYSTORE_PASSWORD=$LEGACY_PASSWORD" >> "$GITHUB_ENV"
            echo "AFTERLOG_KEY_ALIAS=$LEGACY_ALIAS" >> "$GITHUB_ENV"
            echo "AFTERLOG_KEY_PASSWORD=$LEGACY_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "persistent=true" >> "$GITHUB_OUTPUT"
          else
            echo "persistent=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Clé de signature absente : APK de test seulement. Mise à jour en place impossible entre clés différentes."
          fi
      - name: Construire l'APK
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.signing.outputs.persistent }}" == "true" ]]; then
            gradle --no-daemon --stacktrace :app:assembleRelease
            test -f app/build/outputs/apk/release/app-release.apk
          else
            gradle --no-daemon --stacktrace :app:assembleDebug
          fi
      - name: Préparer et vérifier l'APK
        id: verified
        shell: bash
        env:
          VERSION: ${{ steps.appversion.outputs.version }}
        run: |
          set -euo pipefail
          VERSION_CODE="$(sed -nE 's/.*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION_CODE"
          if [[ "${{ steps.signing.outputs.persistent }}" == "true" ]]; then
            SOURCE=app/build/outputs/apk/release/app-release.apk
          else
            SOURCE=app/build/outputs/apk/debug/app-debug.apk
          fi
          cp "$SOURCE" "NOCTARIA-v${VERSION}.apk"
          cp "$SOURCE" "NOCTIS-v${VERSION}.apk"  # Ancien nom d’application
          cp "$SOURCE" "AfterLog-v${VERSION}.apk"  # Alias historique, anciennes versions
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "NOCTARIA-v${VERSION}.apk" > "$RUNNER_TEMP/signing-report.txt"
          SIGNER="$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/signing-report.txt" | head -n 1 | tr '[:upper:]' '[:lower:]')"
          test -n "$SIGNER"
          if [[ "${{ steps.signing.outputs.persistent }}" == "true" ]]; then
            EXPECTED="0eae222a3b88b93b56e3d6b4bbd7f991e65b88030ae3e0f4245662e3f80d4772"
            if [[ "$SIGNER" != "$EXPECTED" ]]; then
              echo "::error::Le certificat Android ne correspond pas à la clé permanente NØCTARIA."
              exit 1
            fi
          fi
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "signer=$SIGNER" >> "$GITHUB_OUTPUT"
      - name: Conserver l'APK dans GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: NOCTARIA-Android-APK
          path: NOCTARIA-v*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publier l'APK dans GitHub Releases
        id: release
        if: steps.signing.outputs.persistent == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.appversion.outputs.version }}
          VERSION_CODE: ${{ steps.verified.outputs.version_code }}
          SIGNER: ${{ steps.verified.outputs.signer }}
          PERSISTENT: ${{ steps.signing.outputs.persistent }}
        shell: bash
        run: |
          set -euo pipefail
          LATEST="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$LATEST" != "$GITHUB_SHA" ]]; then
            git fetch --quiet origin "$LATEST" --depth=1
            if ! git diff --quiet "$GITHUB_SHA" "$LATEST" -- . ':(exclude)README.md'; then
              echo "::notice::Une version de code plus récente est déjà sur main, publication ignorée."
              exit 0
            fi
          fi
          APK="NOCTARIA-v${VERSION}.apk"
          if [[ "$PERSISTENT" == "true" ]]; then
            TAG="v${VERSION}"
            NOTE="APK NØCTARIA signé avec la clé permanente. Installation en place possible si la clé de l'ancienne version est identique."
            test "$SIGNER" = "0eae222a3b88b93b56e3d6b4bbd7f991e65b88030ae3e0f4245662e3f80d4772"
          else
            TAG="v${VERSION}-debug"
            NOTE="Version bêta signée temporairement. Les mises à jour en place ne fonctionnent pas lorsque les clés changent."
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "NOCTIS-v${VERSION}.apk" "AfterLog-v${VERSION}.apk" --clobber
          elif [[ "$PERSISTENT" == "true" ]]; then
            gh release create "$TAG" "$APK" "NOCTIS-v${VERSION}.apk" "AfterLog-v${VERSION}.apk" --target "$GITHUB_SHA" --title "NØCTARIA v${VERSION}" --notes "$NOTE"
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "NØCTARIA v${VERSION} (test)" --notes "$NOTE" --prerelease
          fi
          if [[ "$PERSISTENT" == "true" ]]; then
            cp "$APK" AfterLog.apk
            cp "$APK" NOCTARIA.apk
            cp "$APK" NOCTIS.apk
            export APK_SHA256="$(sha256sum AfterLog.apk | awk '{print $1}')"
            export APK_SIZE="$(stat -c%s AfterLog.apk)"
            python3 - <<'PY'
          import json,os
          data={
              "updateReady":True,
              "packageName":"fr.afterlog.app",
              "versionName":os.environ["VERSION"],
              "versionCode":int(os.environ["VERSION_CODE"]),
              "apkUrl":"https://github.com/Elikto/Afterlog/releases/download/apk-latest/AfterLog.apk",
              "sha256":os.environ["APK_SHA256"],
              "signerSha256":os.environ["SIGNER"],
              "size":int(os.environ["APK_SIZE"])
          }
          with open("update.json","w",encoding="utf-8") as fp:
              json.dump(data,fp,ensure_ascii=False,indent=2)
          PY
            if gh release view apk-latest >/dev/null 2>&1; then
              gh release upload apk-latest AfterLog.apk NOCTARIA.apk NOCTIS.apk update.json --clobber
              gh release edit apk-latest --title "NØCTARIA — dernière version stable" --notes "$NOTE"
            else
              gh release create apk-latest AfterLog.apk NOCTARIA.apk NOCTIS.apk update.json --target "$GITHUB_SHA" \
                --title "NØCTARIA — dernière version stable" --notes "$NOTE"
            fi
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Garder le bouton de téléchargement du README à jour
        if: steps.release.outputs.published == 'true'
        continue-on-error: true
        env:
          VERSION: ${{ steps.appversion.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.persistent }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["VERSION"]
          readme = pathlib.Path("README.md")
          current = readme.read_text(encoding="utf-8")
          suffix = "" if os.environ.get("SIGNED") == "true" else "-debug"
          new_url = (
              f"https://github.com/Elikto/Afterlog/releases/download/"
              f"v{version}{suffix}/NOCTARIA-v{version}.apk"
          )
          current = re.sub(
              r"https://github\.com/Elikto/Afterlog/releases/download/"
              r"v\d+\.\d+\.\d+(?:-debug)?/(?:AfterLog|NOCTIS|NOCTARIA)-v\d+\.\d+\.\d+\.apk",
              new_url,
              current,
          )
          current = re.sub(r"Bêta v\d+\.\d+\.\d+", f"Bêta v{version}", current)
          current = re.sub(r"(?:AfterLog|NOCTIS|NOCTARIA)-v\d+\.\d+\.\d+\.apk", f"NOCTARIA-v{version}.apk", current)
          readme.write_text(current, encoding="utf-8")
          PY
          if ! git diff --quiet -- README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: actualiser le bouton APK [skip ci]"
            git push origin HEAD:main
          fi
