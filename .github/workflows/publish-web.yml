name: NØCTARIA Web PWA
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/publish-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: noctaria-web-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check web/app.js
          node --check web/sw.js
          python3 -m json.tool web/manifest.webmanifest >/dev/null
      - name: Generate install icons
        run: |
          python3 -m pip install --quiet cairosvg
          python3 web/build-icons.py
      - name: Check PWA files
        run: |
          test -s web/index.html
          test -s web/icons/apple-touch-icon.png
          test -s web/icons/icon-192.png
          test -s web/icons/icon-512.png
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy PWA
        id: deploy
        uses: actions/deploy-pages@v4
