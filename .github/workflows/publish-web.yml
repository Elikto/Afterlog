name: NØCTARIA Web PWA
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'app/**'
      - 'shared/**'
      - 'scripts/**'
      - '.github/workflows/publish-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: noctaria-web-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check web/app.js
          node --check web/sw.js
          node --check scripts/check-parity.mjs
          node --check scripts/sync-spotify-profiles.mjs
          node --check scripts/spotify-parity-test.mjs
          node --check scripts/city-autocomplete-test.mjs
          node --check scripts/shotgun-scan-test.mjs
          node --check scripts/shotgun-event-test.mjs
          python3 -m json.tool web/manifest.webmanifest >/dev/null
      - name: Test journal functionality
        run: |
          npm install --no-save --ignore-scripts jsdom@26 fake-indexeddb@6
          node scripts/check-parity.mjs
          node scripts/sync-spotify-profiles.mjs --check
          node scripts/spotify-parity-test.mjs
          node scripts/shotgun-scan-test.mjs
          node scripts/shotgun-event-test.mjs
          node scripts/city-autocomplete-test.mjs
          node web/smoke-test.mjs
      - name: Generate install icons
        run: |
          python3 -m pip install --quiet cairosvg
          python3 web/build-icons.py
      - name: Check PWA files
        run: |
          test -s web/index.html
          test -s web/spotify-trusted.js
          test -s web/icons/apple-touch-icon.png
          test -s web/icons/icon-192.png
          test -s web/icons/icon-512.png
      - name: Package site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy NØCTARIA Web
        id: deploy
        uses: actions/deploy-pages@v4
